[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-recon"
version = "0.1.0"
description = "CTF Recon & Triage CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "pydantic>=2.0",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
ctf-recon = "ctf_recon.cli:app"

[tool.setuptools]
packages = ["ctf_recon"]
